<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="admin.css">

  <style>
    .enter-site-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: #0d6efd;
      color: white;
      border: none;
      padding: 8px 14px;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }
    .enter-site-btn:hover {
      background: #0b5ed7;
    }

    nav {
      margin-top: 50px !important; /* To avoid overlapping button */
    }

    @media (max-width: 600px) {
      .enter-site-btn {
        top: 5px;
        right: 5px;
        padding: 6px 10px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

<button class="enter-site-btn" onclick="window.location.href='clone.html'">Enter Website</button>

<nav>
  <button onclick="showTab('viewProducts')">📦 View Products</button>
  <button onclick="showTab('addProduct')">➕ Add Product</button>
</nav>

<main>
  <section id="addProduct" class="tabContent">
    <h2>Add a New Product</h2>

    <div class="form-group">
      <label>Product Name:</label>
      <input type="text" id="productName">
    </div>

    <div class="form-group">
      <label>Category:</label>
      <select id="category" onchange="updateSubcategories()">
        <option value="">Select Category</option>
        <option value="events">Event</option>
        <option value="special">Special</option>
        <option value="catering">Catering</option>
        <option value="more">More</option>
      </select>
    </div>

    <div class="form-group">
      <label>Subcategory:</label>
      <select id="subcategory">
        <option value="">Select Subcategory</option>
      </select>
    </div>

    <div class="form-group">
      <label>Rate:</label>
      <input type="number" id="rate">
    </div>

    <div class="form-group">
      <label>Product Image:</label>
      <input type="file" id="productImage">
    </div>

    <button class="submit-btn" onclick="addProduct()">Update</button>
  </section>

  <section id="viewProducts" class="tabContent">
    <div id="categoryFilters" class="filter-bar"></div>
    <div id="subcategoryFilters" class="subfilter-bar"></div>
    <div id="productsList"></div>
  </section>
</main>

<div id="loginOverlay" class="login-overlay">
  <div class="login-box">
    <h2>Admin Login</h2>
    <input type="text" id="loginId" placeholder="Username">
    <input type="password" id="loginPassword" placeholder="Password">
    <button onclick="handleLogin()">Login</button>
    <p id="loginError" style="color:red; display:none;">Invalid credentials!</p>
  </div>
</div>

<script type="module" src="admin.js"></script>

</body>
</html>
