<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Album Viewer</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="clone.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark shadow-sm">
  <div class="container d-flex justify-content-between align-items-center">
    <span class="navbar-brand fw-bold">Order Album Viewer</span>

    <div class="d-flex gap-2">
      <button onclick="window.location.href='index.html'" class="btn btn-outline-light btn-sm">Back</button>
      <button id="downloadAllBtn" class="btn btn-success btn-sm" onclick="downloadAllImages()">Download All</button>
    </div>
  </div>
</nav>

<div class="container py-4">
  <h4 class="text-center mb-4 fw-bold">Paste Order Details</h4>

  <textarea id="orderText" class="form-control mb-3" rows="10" placeholder="Paste the WhatsApp order message here..."></textarea>

  <div class="text-center mb-4">
    <button class="btn btn-primary px-4" onclick="generateAlbum()">Generate Album</button>
  </div>

  <hr>

  <div id="album" class="row g-4"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="clone.js"></script>

</body>
</html>
